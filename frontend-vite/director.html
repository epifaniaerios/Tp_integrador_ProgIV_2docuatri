<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sistema de Incidencias - Panel Director</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="dashboard.html">Municipalidad - Incidencias</a>
                <div class="d-flex align-items-center gap-3">
                    <a href="dashboard.html" class="btn btn-light btn-sm">Volver al Registro</a>
                    <span id="user-info" class="text-white small fw-semibold"></span>
                    <button id="btn-logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
                </div>
            </div>
        </nav>

        <div class="container my-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold text-secondary">Dashboard Estadístico - Director de Sistemas</h3>
                <button id="btn-descargar-pdf" class="btn btn-danger fw-semibold">Descargar Reporte PDF</button>
            </div>

            <div id="alert-container"></div>

            <!-- Métricas -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm text-center p-3">
                        <h6 class="text-muted">Total de Incidencias Registradas</h6>
                        <h2 class="fw-bold text-primary mb-0" id="total-incidencias">0</h2>
                    </div>
                </div>
            </div>

        <div class="row g-4">
            <!-- Totales por Estado -->
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-3">
                    <h5 class="fw-bold text-secondary mb-3">Totales por Estado</h5>
                    <ul class="list-group list-group-flush" id="lista-estados">
                        <li class="list-group-item text-muted">Cargando datos...</li>
                    </ul>
                </div>
            </div>

            <!-- Incidencias Prioritarias -->
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-3">
                    <h5 class="fw-bold text-secondary mb-3">Incidencias Prioritarias (Alta sin resolver)</h5>
                    <div class="table-responsive">
                        <table class="table table-sm table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>#</th>
                                    <th>Artículo</th>
                                    <th>Estado</th>
                                    <th>Fecha</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-prioritarias">
                                <tr><td colspan="4" class="text-center text-muted py-3">Cargando...</td></tr>
                            </tbody>
                        </table>    
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="./js/director.js"></script>
    </body>
</html>
