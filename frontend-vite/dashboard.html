<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Incidencias - Panel Principal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Municipalidad - Incidencias</a>
      <div class="d-flex align-items-center gap-3">
        <span id="user-info" class="text-white small fw-semibold"></span>
        <button id="btn-logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold text-secondary">Registro de Incidencias</h3>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalIncidencia">
        + Nueva Incidencia
      </button>
    </div>

    <!-- Contenedor de Alertas -->
    <div id="alert-container"></div>

    <!-- Tabla de Incidencias -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Título</th>
                <th>Categoría</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th>Creado por</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-incidencias">
              <tr>
                <td colspan="7" class="text-center py-4 text-muted">Cargando incidencias...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Nueva Incidencia -->
  <div class="modal fade" id="modalIncidencia" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold">Registrar Nueva Incidencia</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="form-nueva-incidencia">
          <div class="modal-body">
            <div class="mb-3">
              <label for="titulo" class="form-label">Título</label>
              <input type="text" class="form-control" id="titulo" placeholder="Ej: Semáforo fuera de servicio" required>
            </div>
            
            <div class="mb-3">
              <label for="id_categoria" class="form-label">Categoría</label>
              <select class="form-select" id="id_categoria" required>
                <option value="">Cargando categorías...</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="prioridad" class="form-label">Prioridad</label>
              <select class="form-select" id="prioridad" required>
                <option value="BAJA">Baja</option>
                <option value="MEDIA" selected>Media</option>
                <option value="ALTA">Alta</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="descripcion" class="form-label">Descripción del problema</label>
              <textarea class="form-control" id="descripcion" rows="3" required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar Reporte</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
