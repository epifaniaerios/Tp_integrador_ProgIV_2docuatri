<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Incidencias - Artículos</title>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="dashboard.html">Municipalidad - Incidencias</a>
      <div class="d-flex align-items-center gap-3">
        <a href="dashboard.html" class="btn btn-light btn-sm">Volver a incidencias</a>
        <span id="user-info" class="text-white small fw-semibold"></span>
        <button id="btn-logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <h3 class="fw-bold text-secondary mb-4">Artículos</h3>

    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Descripción</th>
              <th>Área</th>
              <th>Categoría</th>
            </tr>
          </thead>
          <tbody id="tabla-articulos">
            <tr><td colspan="4" class="text-center py-4 text-muted">Cargando artículos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="./js/articulos.js"></script>
</body>
</html>
