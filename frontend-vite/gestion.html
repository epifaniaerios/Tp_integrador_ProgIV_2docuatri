<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Incidencias - Categorías y Artículos</title>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="dashboard.html">Municipalidad - Incidencias</a>
      <div class="d-flex align-items-center gap-3">
        
        <div class="dropdown">
          <button class="btn btn-link text-white text-decoration-none dropdown-toggle d-inline-flex align-items-center gap-2 p-0 border-0 shadow-none" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <img id="user-avatar" class="rounded-circle d-none" width="28" height="28" style="object-fit: cover;" alt="Avatar">
            <span id="user-info" class="small fw-semibold">Cargando...</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="userDropdown">
            <li>
              <button type="button" class="dropdown-item py-2" data-bs-toggle="modal" data-bs-target="#modalAvatar">Foto de perfil</button>
            </li>
            <li>
              <button type="button" class="dropdown-item py-2" data-bs-toggle="modal" data-bs-target="#modalCambiarClave">Cambiar Contraseña</button>
            </li>
          </ul>
        </div>

        <button id="btn-logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <div>
        <h3 class="fw-bold text-secondary mb-1">Categorías y Artículos</h3>
        <a href="dashboard.html" class="btn btn-outline-secondary btn-sm fw-semibold mt-2">← Volver a incidencias</a>
      </div>
    </div>

    <div id="alert-container"></div>

    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-categorias" type="button">Categorías</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-articulos" type="button">Artículos</button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- Categorías -->
      <div class="tab-pane fade show active" id="tab-categorias">
        <div class="d-flex justify-content-end mb-3">
          <button id="btn-nueva-categoria" class="btn btn-primary">+ Nueva Categoría</button>
        </div>
        <div class="card border-0 shadow-sm">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr><th>#</th><th>Descripción</th><th class="text-end">Acciones</th></tr>
              </thead>
              <tbody id="tabla-categorias">
                <tr><td colspan="3" class="text-center py-4 text-muted">Cargando...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Artículos -->
      <div class="tab-pane fade" id="tab-articulos">
        <div class="d-flex justify-content-end mb-3">
          <button id="btn-nuevo-articulo" class="btn btn-primary">+ Nuevo Artículo</button>
        </div>
        <div class="card border-0 shadow-sm">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr><th>#</th><th>Descripción</th><th>Área</th><th>Categoría</th><th class="text-end">Acciones</th></tr>
              </thead>
              <tbody id="tabla-articulos">
                <tr><td colspan="5" class="text-center py-4 text-muted">Cargando...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal Categoría -->
  <div class="modal fade" id="modalCategoria" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="titulo-modal-categoria">Nueva categoría</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="form-categoria">
          <div class="modal-body">
            <input type="hidden" id="categoria-id">
            <div class="mb-3">
              <label for="categoria-descripcion" class="form-label">Descripción</label>
              <input type="text" class="form-control" id="categoria-descripcion" required>
            </div>
            <div id="error-categoria" class="text-danger small"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Artículo -->
  <div class="modal fade" id="modalArticulo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="titulo-modal-articulo">Nuevo artículo</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="form-articulo">
          <div class="modal-body">
            <input type="hidden" id="articulo-id">
            <div class="mb-3">
              <label for="articulo-descripcion" class="form-label">Descripción</label>
              <input type="text" class="form-control" id="articulo-descripcion" required>
            </div>
            <div class="mb-3">
              <label for="articulo-area" class="form-label">Área</label>
              <select class="form-select" id="articulo-area" required></select>
            </div>
            <div class="mb-3">
              <label for="articulo-categoria" class="form-label">Categoría</label>
              <select class="form-select" id="articulo-categoria" required></select>
            </div>
            <div id="error-articulo" class="text-danger small"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Cambiar Contraseña -->
  <div class="modal fade" id="modalCambiarClave" tabindex="-1" aria-labelledby="modalCambiarClaveLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modalCambiarClaveLabel">Cambiar Contraseña</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="form-cambiar-clave">
          <div class="modal-body">
            <div class="mb-3">
              <label for="clave-actual" class="form-label">Contraseña Actual</label>
              <input type="password" class="form-control" id="clave-actual" required placeholder="Ingresá tu clave actual">
            </div>
            <div class="mb-3">
              <label for="clave-nueva" class="form-label">Nueva Contraseña</label>
              <input type="password" class="form-control" id="clave-nueva" required minlength="6" placeholder="Mínimo 6 caracteres">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Actualizar Contraseña</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Foto de perfil -->
  <div class="modal fade" id="modalAvatar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Foto de perfil</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="form-avatar">
          <div class="modal-body">
            <label for="archivo-avatar" class="form-label">Elegí una imagen (JPG, PNG o WEBP, máximo 2 MB)</label>
            <input type="file" class="form-control" id="archivo-avatar" accept="image/jpeg,image/png,image/webp" required>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Subir foto</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="./js/gestion.js"></script>
</body>
</html>
